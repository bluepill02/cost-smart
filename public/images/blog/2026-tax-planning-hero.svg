<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#f0f7ff" />

  <text x="400" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2026 Tax Planning &amp; TCJA Sunset</text>

  <g transform="translate(100, 150)">
    <rect width="180" height="150" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="3" />
    <text x="90" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e40af" text-anchor="middle">Tax Rates</text>
    <path d="M 50 110 Q 90 70 130 50" fill="none" stroke="#ef4444" stroke-width="4" marker-end="url(#arrow)" />
    <text x="90" y="130" font-family="Arial, sans-serif" font-size="16" fill="#4b5563" text-anchor="middle">Rising to 39.6%</text>
  </g>

  <g transform="translate(310, 150)">
    <rect width="180" height="150" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="3" />
    <text x="90" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e40af" text-anchor="middle">Deductions</text>
    <path d="M 50 50 Q 90 90 130 110" fill="none" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow-down)" />
    <text x="90" y="130" font-family="Arial, sans-serif" font-size="16" fill="#4b5563" text-anchor="middle">Standard Dropping</text>
  </g>

  <g transform="translate(520, 150)">
    <rect width="180" height="150" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="3" />
    <text x="90" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e40af" text-anchor="middle">401(k) Limits</text>
    <path d="M 50 110 Q 90 70 130 50" fill="none" stroke="#10b981" stroke-width="4" marker-end="url(#arrow-green)" />
    <text x="90" y="130" font-family="Arial, sans-serif" font-size="16" fill="#4b5563" text-anchor="middle">Up to $72,000</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
  </defs>
</svg>
